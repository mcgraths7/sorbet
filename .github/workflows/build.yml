name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Supersede in-flight runs for the same ref (a new push to a PR cancels the old).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo.
permissions:
  contents: read

jobs:
  # Cheap, independent gates run in parallel so every failure is visible at once
  # and shows up as its own check. The expensive `build` job (below) waits on the
  # code-quality trio, so no build compute is spent on a branch a lint/type error
  # would reject anyway.

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  dependency-review:
    # Reviews the dependency diff of a PR; there's no diff to review on push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm run lint

  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint styles (Stylelint)
        run: pnpm run lint:styles

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

  build:
    # The one expensive job: only runs once the fast checks are green.
    needs: [eslint, stylelint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The build compares every theme file with its golden copy. That cannot
      # see a golden that was rewritten in the same pull request — both sides
      # match — so the frozen ones are also held to the base branch's copy,
      # the one thing a pull request cannot edit. (On a push to main there is
      # no base; the pull request that got it there already ran this.)
      - name: Verify the frozen golden files are the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          pnpm run check:golden:base "origin/${BASE_REF}"

      # The state-shadow allowlist only shrinks (legibility-spec.md L154). The
      # test holds allowlist + removed list to e24df74's sites, which a site
      # moved back from one list to the other cannot break; the base branch's
      # removed list can. Every entry it has must still be here.
      - name: Verify the state-shadow removed list keeps the base branch's entries
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/check-allowlist-base.ts "origin/${BASE_REF}"

      # A gate that has stopped working looks like a gate that passes. This
      # breaks the golden comparison on purpose and fails if it stays green.
      - name: Verify the golden gate still bites
        run: pnpm run test:golden

      # The contrast contract was once measured in five places that disagreed,
      # each of them green. This runs every report against the one measurement
      # on good presets and on ones broken on purpose, both gates on the broken
      # ones, and the measurement itself on colours as a minifier respells them.
      - name: Verify the contrast contract is measured once
        run: pnpm run test:contrast

      # Which contract a preset is held to is data now, and every way of getting
      # that wrong is silent: a rule in the wrong tier, a floor retyped, a
      # mistyped name read as "not held". This holds the new code to what the
      # old code answered (fixtures recorded from it), proves the comparison
      # bites, and checks the colour instruments against published values.
      - name: Verify every preset is held to the contract it was
        run: pnpm run test:contracts

      # Everything in this repo consumes Sorbet by symlink, which hides what
      # breaks a real consumer. Pack the tarballs and install them into a
      # throwaway project outside the workspace. --no-build reuses the step above.
      - name: Verify packages are consumable outside the monorepo
        run: pnpm run check:consumable --no-build

      # The CLI's create command once shipped resolving files relative to a
      # monorepo root that doesn't exist when installed. This runs the PACKED
      # tarball in a temp project — the checkout's dist would pass for the
      # same false reason everything in-repo does.
      - name: Verify the packed CLI works standalone
        run: pnpm run check:cli

      # "Kept current per PR" used to be a memory; now an exported component
      # missing from the README catalog fails the build naming it.
      - name: Verify the component catalog is complete
        run: pnpm run check:catalog
